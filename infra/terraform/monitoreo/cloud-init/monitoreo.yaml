#cloud-config
# Configuración inicial de la instancia de monitoreo (primer arranque).
hostname: asist-monitoreo
fqdn: asist-monitoreo
manage_etc_hosts: true
timezone: America/La_Paz

package_update: true
packages:
  - acl
  - rsync
  - apt-transport-https
  - gnupg

# 1 GB de swap: Grafana + Prometheus en una t3.small
swap:
  filename: /swapfile
  size: 1073741824

final_message: "cloud-init monitoreo terminado en $UPTIME s"
